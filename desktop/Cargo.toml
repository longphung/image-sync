[package]
name = "image-sync-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14.10"
if-addrs = "0.15"
time = "0.3"
pem = "4"

# Image decoding is many times slower unoptimized, so dependencies are optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
