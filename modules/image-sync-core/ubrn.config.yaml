rust:
  directory: ../../rust
  manifestPath: image-sync-ffi/Cargo.toml

android:
  # Skip legacy 32-bit x86 emulator target; arm64-v8a covers real devices,
  # x86_64 covers modern emulators, armeabi-v7a covers older real devices.
  targets:
    - arm64-v8a
    - armeabi-v7a
    - x86_64

# android/CMakeLists.txt is hand-patched (see comment in that file) to work around
# an upstream uniffi-bindgen-react-native bug where its own package.json "exports"
# map doesn't include "./package.json", breaking the generated require.resolve()
# call. Exclude it from regeneration so `ubrn build android --and-generate` doesn't
# clobber the fix.
noOverwrite:
  - android/CMakeLists.txt
